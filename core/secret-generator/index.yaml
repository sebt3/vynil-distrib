---
apiVersion: vinyl.solidite.fr/v1beta1
kind: Component
category: core
metadata:
  name: secret-generator
  description: Automatically generated secrets for Kubernetes
options:
  image:
    default:
      pull_policy: IfNotPresent
      registry: docker.io
      repository: sebt3/kubernetes-secret-generator
      tag: 3.4.0
    examples:
    - pull_policy: IfNotPresent
      registry: docker.io
      repository: sebt3/kubernetes-secret-generator
      tag: 3.4.0
    properties:
      properties:
        default: null
        pull_policy:
          enum:
          - Always
          - Never
          - IfNotPresent
      pull_policy:
        default: IfNotPresent
        type: string
      registry:
        default: docker.io
        type: string
      repository:
        default: sebt3/kubernetes-secret-generator
        type: string
      tag:
        default: 3.4.0
        type: string
    type: object
  namespaces:
    default: ''
    examples:
    - ''
    type: string
  secret_length:
    default: 40
    examples:
    - 40
    type: integer
dependencies:
- dist: null
  category: crd
  component: secret-generator
providers:
  kubernetes: true
  authentik: null
  kubectl: true
  postgresql: null
  mysql: null
  restapi: null
  http: null
  gitea: null
tfaddtype: null
