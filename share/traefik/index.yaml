---
apiVersion: vinyl.solidite.fr/v1beta1
kind: Component
category: share
metadata:
  name: traefik
  description: Traefik is an open-source Edge Router that makes publishing your services a fun and easy experience. It receives requests on behalf of your system and finds out which components are responsible for handling them.
options:
  backend_skip_verify:
    default: false
    examples:
    - false
    type: boolean
  image:
    default:
      pullPolicy: IfNotPresent
      registry: docker.io
      repository: traefik
      tag: v3.0.1
    examples:
    - pullPolicy: IfNotPresent
      registry: docker.io
      repository: traefik
      tag: v3.0.1
    properties:
      pullPolicy:
        default: IfNotPresent
        enum:
        - Always
        - Never
        - IfNotPresent
        type: string
      registry:
        default: docker.io
        type: string
      repository:
        default: traefik
        type: string
      tag:
        default: v3.0.1
        type: string
    type: object
  ingressClass:
    default: traefik
    examples:
    - traefik
    type: string
  is-default:
    default: 'true'
    examples:
    - 'true'
    type: string
  use_plugins:
    default: true
    examples:
    - true
    type: boolean
dependencies:
- dist: null
  category: crd
  component: traefik
providers:
  kubernetes: null
  authentik: null
  kubectl: true
  postgresql: null
  mysql: null
  restapi: null
  http: null
  gitea: null
tfaddtype: null
